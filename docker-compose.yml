services:
  sferum-cabinet:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sferum-cabinet-app
    restart: unless-stopped
    ports:
      - "80:80"
      - "5050:5050"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - MAX_BOT_TOKEN=${MAX_BOT_TOKEN:-f9LHodD0cOJX1binrlWBycWED-mAlS-161FfBX83BtJMMXcyGKxxnz7oOhr9zWHrnXlyFVf9AeDTHSLo9m8o}
      - SFERUM_SCHOOL_ID=maou-lit-nsk
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5050/api/system/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - sferum-data:/app/api/data

volumes:
  sferum-data:
    name: sferum_cabinet_storage
